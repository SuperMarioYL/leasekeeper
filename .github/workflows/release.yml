name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      # goreleaser builds linux/darwin/windows x amd64/arm64 into dist/,
      # writes dist/checksums.txt and creates the GitHub release with the
      # archives attached, so no separate upload step is needed.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
