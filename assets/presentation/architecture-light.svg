<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="architecture-light-t architecture-light-d"><title id="architecture-light-t">Leasekeeper architecture</title><desc id="architecture-light-d">Six packages in one binary: the CLI entry, the command surface, the socket client, the broker holding the lease table and the wait-for graph, and the lease and waitgraph primitives.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#318431"/><stop offset=".55" stop-color="#3b8060"/><stop offset="1" stop-color="#637a56"/></linearGradient><radialGradient id="halo"><stop stop-color="#318431" stop-opacity=".30"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#637a56" stop-opacity=".22"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#cbf7cb" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#318431" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557b6b" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="1000" height="430" fill="#f9fef9"/><rect width="1000" height="430" fill="url(#grid)" opacity=".5"/><circle cx="500.0" cy="215.0" r="365.5" fill="url(#halo)"/><text x="40" y="46" fill="#132a1c" font-size="18" text-anchor="start" font-weight="600">One binary, three modes, one broker per run</text><text x="40" y="72.0" fill="#557b6b" font-size="12.5" text-anchor="start" font-weight="400">The packages a run touches, and the one that owns</text><text x="40" y="90.125" fill="#557b6b" font-size="12.5" text-anchor="start" font-weight="400">the state.</text><line x1="40" y1="96" x2="960" y2="96" stroke="#cbf7cb" stroke-width="1"/><rect x="40" y="128" width="196" height="74" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="40" y="128" width="3" height="74" rx="1.5" fill="#318431"/><text x="54" y="154" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">cmd/leasekeeper</text><text x="54" y="174.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Single entry point</text><path d="M242 165.0h20" stroke="#557b6b" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#arrow-d)"/><path class="flow flow-a" d="M242 165.0h20" stroke="#318431" stroke-width="1.8" fill="none"/><rect x="268" y="128" width="196" height="74" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="268" y="128" width="3" height="74" rx="1.5" fill="#318431"/><text x="282" y="154" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">internal/cli</text><text x="282" y="174.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">run · acquire · release ·</text><text x="282" y="190.675" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">status · demo</text><path d="M470 165.0h20" stroke="#557b6b" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#arrow-d)"/><path class="flow flow-b" d="M470 165.0h20" stroke="#318431" stroke-width="1.8" fill="none"/><rect x="496" y="128" width="196" height="74" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="496" y="128" width="3" height="74" rx="1.5" fill="#318431"/><text x="510" y="154" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">internal/client</text><text x="510" y="174.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Unix-socket RPC</text><path d="M698 165.0h20" stroke="#557b6b" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#arrow-d)"/><path class="flow flow-c" d="M698 165.0h20" stroke="#318431" stroke-width="1.8" fill="none"/><rect x="724" y="128" width="196" height="74" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="724" y="128" width="3" height="74" rx="1.5" fill="#318431"/><text x="738" y="154" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">internal/broker</text><text x="738" y="174.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Lease table + wait-for</text><text x="738" y="190.675" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">graph</text><rect x="300" y="246" width="264" height="74" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="300" y="246" width="3" height="74" rx="1.5" fill="#318431"/><text x="314" y="272" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">internal/lease</text><text x="314" y="292.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">file · port · gpu · quota</text><path d="M822.0 202v22h-390.0v18" fill="none" stroke="#3b8060" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#arrow)"/><path class="flow flow-b" fill="none" stroke="#3b8060" stroke-width="1.8" d="M822.0 202v22h-390.0v18"/><rect x="588" y="246" width="264" height="74" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="588" y="246" width="3" height="74" rx="1.5" fill="#318431"/><text x="602" y="272" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">internal/waitgraph</text><text x="602" y="292.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Refuses the circular wait</text><path d="M822.0 202v22h-102.0v18" fill="none" stroke="#3b8060" stroke-opacity=".75" stroke-width="1.6" marker-end="url(#arrow)"/><path class="flow flow-c" fill="none" stroke="#3b8060" stroke-width="1.8" d="M822.0 202v22h-102.0v18"/><text x="40" y="354" fill="#557b6b" font-size="13" text-anchor="start" font-weight="400">The broker owns the table and the graph; everything else is a caller.</text></svg>