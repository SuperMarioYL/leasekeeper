<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="integrations-light-t integrations-light-d"><title id="integrations-light-t">What you can lease, and how it reaches the broker</title><desc id="integrations-light-d">The broker hub connected to the four leaseable resource kinds and the run wrapper and socket.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#318431"/><stop offset=".55" stop-color="#3b8060"/><stop offset="1" stop-color="#637a56"/></linearGradient><radialGradient id="halo"><stop stop-color="#318431" stop-opacity=".30"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#637a56" stop-opacity=".22"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#cbf7cb" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#318431" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557b6b" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="1000" height="430" fill="#f9fef9"/><rect width="1000" height="430" fill="url(#grid)" opacity=".5"/><circle cx="500.0" cy="215.0" r="365.5" fill="url(#halo)"/><text x="40" y="46" fill="#132a1c" font-size="18" text-anchor="start" font-weight="600">What you can lease, and how it reaches the broker</text><text x="40" y="72.0" fill="#557b6b" font-size="12.5" text-anchor="start" font-weight="400">The kind is part of the name, so a path can never collide</text><text x="40" y="90.125" fill="#557b6b" font-size="12.5" text-anchor="start" font-weight="400">with a port.</text><line x1="40" y1="96" x2="960" y2="96" stroke="#cbf7cb" stroke-width="1"/><circle cx="150" cy="262" r="118" fill="none" stroke="#cbf7cb" stroke-width="1" stroke-dasharray="4 7"/><circle cx="150" cy="262" r="86" fill="none" stroke="#cbf7cb" stroke-width="1" stroke-dasharray="4 7"/><g class="spin" style="transform-origin:150px 262px"><circle cx="268" cy="262" r="5" fill="#318431"/><circle cx="64" cy="262" r="3.5" fill="#3b8060"/></g><circle cx="150" cy="262" r="62" fill="#f7fef7" stroke="#318431" stroke-opacity=".7" stroke-width="1.8"/><text x="150" y="256" fill="#318431" font-size="17" text-anchor="middle" font-weight="700">broker</text><text x="150" y="280" fill="#557b6b" font-size="11.5" text-anchor="middle" font-weight="400">table + graph</text><rect x="372" y="132" width="200" height="66" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="372" y="132" width="3" height="66" rx="1.5" fill="#318431"/><text x="386" y="158" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">file:&lt;path&gt;</text><text x="386" y="178.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">One writer per file</text><path d="M212 262C300 262 282 165.0 366 165.0" fill="none" stroke="#3b8060" stroke-opacity=".38" stroke-width="1.3"/><path class="flow flow-a" d="M212 262C300 262 282 165.0 366 165.0" fill="none" stroke="#318431" stroke-width="1.6"/><rect x="372" y="220" width="200" height="66" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="372" y="220" width="3" height="66" rx="1.5" fill="#318431"/><text x="386" y="246" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">port:&lt;n&gt;</text><text x="386" y="266.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">One listener per port</text><path d="M212 262C300 262 282 253.0 366 253.0" fill="none" stroke="#3b8060" stroke-opacity=".38" stroke-width="1.3"/><path class="flow flow-b" d="M212 262C300 262 282 253.0 366 253.0" fill="none" stroke="#318431" stroke-width="1.6"/><rect x="372" y="308" width="200" height="66" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="372" y="308" width="3" height="66" rx="1.5" fill="#318431"/><text x="386" y="334" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">gpu:&lt;id&gt;</text><text x="386" y="354.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Named, not fenced</text><path d="M212 262C300 262 282 341.0 366 341.0" fill="none" stroke="#3b8060" stroke-opacity=".38" stroke-width="1.3"/><path class="flow flow-c" d="M212 262C300 262 282 341.0 366 341.0" fill="none" stroke="#318431" stroke-width="1.6"/><rect x="660" y="132" width="200" height="66" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="660" y="132" width="3" height="66" rx="1.5" fill="#318431"/><text x="674" y="158" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">quota:&lt;name&gt;</text><text x="674" y="178.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Shared API budget</text><path d="M212 262C300 262 570 165.0 654 165.0" fill="none" stroke="#3b8060" stroke-opacity=".38" stroke-width="1.3"/><path class="flow flow-a" d="M212 262C300 262 570 165.0 654 165.0" fill="none" stroke="#318431" stroke-width="1.6"/><rect x="660" y="220" width="200" height="66" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="660" y="220" width="3" height="66" rx="1.5" fill="#318431"/><text x="674" y="246" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">leasekeeper run</text><text x="674" y="266.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Wraps any command</text><path d="M212 262C300 262 570 253.0 654 253.0" fill="none" stroke="#3b8060" stroke-opacity=".38" stroke-width="1.3"/><path class="flow flow-b" d="M212 262C300 262 570 253.0 654 253.0" fill="none" stroke="#318431" stroke-width="1.6"/><rect x="660" y="308" width="200" height="66" rx="10" fill="#f7fef7" stroke="#318431" stroke-opacity=".55" stroke-width="1.2"/><rect x="660" y="308" width="3" height="66" rx="1.5" fill="#318431"/><text x="674" y="334" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">Unix socket</text><text x="674" y="354.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">One broker per run</text><path d="M212 262C300 262 570 341.0 654 341.0" fill="none" stroke="#3b8060" stroke-opacity=".38" stroke-width="1.3"/><path class="flow flow-c" d="M212 262C300 262 570 341.0 654 341.0" fill="none" stroke="#318431" stroke-width="1.6"/><text x="40" y="404" fill="#557b6b" font-size="12.5" text-anchor="start" font-weight="400">Reached through `leasekeeper run`, which puts the socket in the child&#x27;s environment.</text></svg>