<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="demo-0-light-t demo-0-light-d"><title id="demo-0-light-t">Recorded leasekeeper demo</title><desc id="demo-0-light-d">The recorded demo: agent a takes the file, agent b takes the port, a waits for the port, and b&#x27;s request for the file is refused with the cycle b -&gt; a -&gt; b.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#318431"/><stop offset=".55" stop-color="#3b8060"/><stop offset="1" stop-color="#637a56"/></linearGradient><radialGradient id="halo"><stop stop-color="#318431" stop-opacity=".30"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#637a56" stop-opacity=".22"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#cbf7cb" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#318431" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557b6b" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="1000" height="380" fill="#f9fef9"/><rect width="1000" height="380" fill="url(#grid)" opacity=".5"/><rect x="40" y="40" width="920" height="300" rx="14" fill="#f3fdf3" stroke="#cbf7cb" stroke-width="1.2"/><rect x="40" y="40" width="920" height="34" rx="14" fill="#f7fef7"/><rect x="40" y="60" width="920" height="14" fill="#f7fef7"/><line x1="40" y1="74" x2="960" y2="74" stroke="#cbf7cb" stroke-width="1"/><circle cx="60" cy="57" r="5" fill="#f06060" fill-opacity=".85"/><circle cx="76" cy="57" r="5" fill="#e8c34a" fill-opacity=".85"/><circle cx="92" cy="57" r="5" fill="#57c46a" fill-opacity=".85"/><text x="114" y="62" fill="#557b6b" font-size="12" text-anchor="start" font-weight="600">leasekeeper — two agents, one resource pair</text><text class="mono" x="68" y="92" fill="#557b6b" font-size="15" text-anchor="start" font-weight="400">$ leasekeeper demo</text><text class="mono" x="68" y="132" fill="#3b8060" font-size="15" text-anchor="start" font-weight="400">[a] acquire file:src/a.go    granted</text><text class="mono" x="68" y="172" fill="#3b8060" font-size="15" text-anchor="start" font-weight="400">[b] acquire port:8080        granted</text><text class="mono" x="68" y="212" fill="#637a56" font-size="15" text-anchor="start" font-weight="400">[a] acquire port:8080        waiting (held by b)</text><text class="mono" x="68" y="252" fill="#318431" font-size="13" text-anchor="start" font-weight="400">[b] acquire file:src/a.go    acquire denied — would deadlock: b -&gt; a -&gt; b</text><text class="mono" x="68" y="292" fill="#132a1c" font-size="15" text-anchor="start" font-weight="400">Wait-for graph:  a -&gt; b</text></svg>