<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="scene-dark-t scene-dark-d"><title id="scene-dark-t">Leasekeeper graph</title><desc id="scene-dark-d">A static graph of the agents, the resources they hold and the wait edge between them.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#56e656"/><stop offset=".55" stop-color="#6ae7ac"/><stop offset="1" stop-color="#c7f6ac"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e656" stop-opacity=".30"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#c7f6ac" stop-opacity=".22"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#173c1d" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e656" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9a8" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="1000" height="430" fill="#050c0d"/><rect width="1000" height="430" fill="url(#grid)" opacity=".5"/><circle cx="500.0" cy="215.0" r="365.5" fill="url(#halo)"/><path d="M200 210L800 190" stroke="#173c1d" stroke-opacity=".85" stroke-width="1.4"/><path d="M500 130L500 320" stroke="#173c1d" stroke-opacity=".85" stroke-width="1.4"/><path d="M500 320L200 210" stroke="#173c1d" stroke-opacity=".85" stroke-width="1.4"/><path d="M200 350L200 210" stroke="#173c1d" stroke-opacity=".85" stroke-width="1.4"/><path d="M800 340L800 190" stroke="#173c1d" stroke-opacity=".85" stroke-width="1.4"/><path d="M500 130L800 340" stroke="#173c1d" stroke-opacity=".85" stroke-width="1.4"/><path d="M500 320L200 350" stroke="#173c1d" stroke-opacity=".85" stroke-width="1.4"/><path d="M200 210L500 320" stroke="#56e656" stroke-width="2" fill="none"/><path d="M500 320L200 210" stroke="#6ae7ac" stroke-width="2" fill="none"/><text x="352" y="274" fill="#56e656" font-size="14" text-anchor="start" font-weight="600">a -&gt; b</text><circle cx="200" cy="210" r="9" fill="#56e656" fill-opacity=".18" stroke="#56e656" stroke-width="1.6"/><text x="200" y="190" fill="#f4fdee" font-size="13" text-anchor="middle" font-weight="600">a</text><circle cx="500" cy="130" r="9" fill="#6ae7ac" fill-opacity=".18" stroke="#6ae7ac" stroke-width="1.6"/><text x="500" y="110" fill="#f4fdee" font-size="13" text-anchor="middle" font-weight="600">b</text><circle cx="800" cy="190" r="9" fill="#c7f6ac" fill-opacity=".18" stroke="#c7f6ac" stroke-width="1.6"/><text x="800" y="170" fill="#f4fdee" font-size="13" text-anchor="middle" font-weight="600">file:src/a.go</text><circle cx="500" cy="320" r="9" fill="#56e656" fill-opacity=".18" stroke="#56e656" stroke-width="1.6"/><text x="500" y="300" fill="#f4fdee" font-size="13" text-anchor="middle" font-weight="600">port:8080</text><circle cx="200" cy="350" r="9" fill="#6ae7ac" fill-opacity=".18" stroke="#6ae7ac" stroke-width="1.6"/><text x="200" y="330" fill="#f4fdee" font-size="13" text-anchor="middle" font-weight="600">gpu:0</text><circle cx="800" cy="340" r="9" fill="#c7f6ac" fill-opacity=".18" stroke="#c7f6ac" stroke-width="1.6"/><text x="800" y="320" fill="#f4fdee" font-size="13" text-anchor="middle" font-weight="600">quota:api</text><text x="40" y="46" fill="#f4fdee" font-size="18" text-anchor="start" font-weight="600">Leases and a wait-for graph, in one local binary</text></svg>