<svg xmlns="http://www.w3.org/2000/svg" width="460" height="620" viewBox="0 0 460 620" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="integrations-mobile-dark-t integrations-mobile-dark-d"><title id="integrations-mobile-dark-t">What you can lease, and how it reaches the broker</title><desc id="integrations-mobile-dark-d">The broker above the four leaseable resource kinds and the run wrapper and socket.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#56e656"/><stop offset=".55" stop-color="#6ae7ac"/><stop offset="1" stop-color="#c7f6ac"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e656" stop-opacity=".30"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#c7f6ac" stop-opacity=".22"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#173c1d" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e656" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9a8" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="460" height="620" fill="#050c0d"/><rect width="460" height="620" fill="url(#grid)" opacity=".5"/><circle cx="230.0" cy="310.0" r="391.0" fill="url(#halo)"/><text x="28" y="46" fill="#f4fdee" font-size="16" text-anchor="start" font-weight="600">What you can lease, and how it reaches the broker</text><text x="28" y="72" fill="#95b9a8" font-size="12.5" text-anchor="start" font-weight="400">Four resource kinds, one wrapper.</text><circle cx="230.0" cy="140" r="44" fill="#0c1717" stroke="#56e656" stroke-opacity=".7" stroke-width="1.6"/><text x="230.0" y="145" fill="#56e656" font-size="15" text-anchor="middle" font-weight="700">broker</text><path d="M230.0 184C230.0 212 44 206 44 258" fill="none" stroke="#6ae7ac" stroke-opacity=".5" stroke-width="1.4"/><line x1="44" y1="258" x2="44" y2="578" stroke="#6ae7ac" stroke-opacity=".45" stroke-width="1.4"/><line x1="44" y1="258" x2="64" y2="258" stroke="#6ae7ac" stroke-opacity=".45" stroke-width="1.4"/><rect x="64" y="230" width="368" height="56" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="64" y="230" width="3" height="56" rx="1.5" fill="#56e656"/><text x="78" y="256" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">file:&lt;path&gt;</text><text x="78" y="276.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">One writer per file</text><line x1="44" y1="322" x2="64" y2="322" stroke="#6ae7ac" stroke-opacity=".45" stroke-width="1.4"/><rect x="64" y="294" width="368" height="56" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="64" y="294" width="3" height="56" rx="1.5" fill="#56e656"/><text x="78" y="320" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">port:&lt;n&gt;</text><text x="78" y="340.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">One listener per port</text><line x1="44" y1="386" x2="64" y2="386" stroke="#6ae7ac" stroke-opacity=".45" stroke-width="1.4"/><rect x="64" y="358" width="368" height="56" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="64" y="358" width="3" height="56" rx="1.5" fill="#56e656"/><text x="78" y="384" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">gpu:&lt;id&gt;</text><text x="78" y="404.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Named, not fenced</text><line x1="44" y1="450" x2="64" y2="450" stroke="#6ae7ac" stroke-opacity=".45" stroke-width="1.4"/><rect x="64" y="422" width="368" height="56" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="64" y="422" width="3" height="56" rx="1.5" fill="#56e656"/><text x="78" y="448" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">quota:&lt;name&gt;</text><text x="78" y="468.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Shared API budget</text><line x1="44" y1="514" x2="64" y2="514" stroke="#6ae7ac" stroke-opacity=".45" stroke-width="1.4"/><rect x="64" y="486" width="368" height="56" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="64" y="486" width="3" height="56" rx="1.5" fill="#56e656"/><text x="78" y="512" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">leasekeeper run</text><text x="78" y="532.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Wraps any command</text><line x1="44" y1="578" x2="64" y2="578" stroke="#6ae7ac" stroke-opacity=".45" stroke-width="1.4"/><rect x="64" y="550" width="368" height="56" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="64" y="550" width="3" height="56" rx="1.5" fill="#56e656"/><text x="78" y="576" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">Unix socket</text><text x="78" y="596.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">One broker 