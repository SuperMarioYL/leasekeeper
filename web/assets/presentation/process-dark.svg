<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="process-dark-t process-dark-d"><title id="process-dark-t">What happens on one acquire</title><desc id="process-dark-d">Four checks on one acquire and the three outcomes: granted, queued then granted, and refused with the cycle printed.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#56e656"/><stop offset=".55" stop-color="#6ae7ac"/><stop offset="1" stop-color="#c7f6ac"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e656" stop-opacity=".30"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#c7f6ac" stop-opacity=".22"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#173c1d" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e656" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9a8" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="1000" height="430" fill="#050c0d"/><rect width="1000" height="430" fill="url(#grid)" opacity=".5"/><circle cx="500.0" cy="215.0" r="365.5" fill="url(#halo)"/><text x="40" y="46" fill="#f4fdee" font-size="18" text-anchor="start" font-weight="600">What happens on one acquire</text><text x="40" y="72.0" fill="#95b9a8" font-size="12.5" text-anchor="start" font-weight="400">Four checks, three outcomes — and a refusal that names the cycle.</text><line x1="40" y1="96" x2="960" y2="96" stroke="#173c1d" stroke-width="1"/><rect x="40" y="150" width="202" height="112" rx="12" fill="#0c1717" stroke="#173c1d" stroke-width="1.1"/><circle cx="70" cy="180" r="16" fill="#56e656" fill-opacity=".16" stroke="#56e656" stroke-opacity=".7"/><text x="70" y="185" fill="#56e656" font-size="14" text-anchor="middle" font-weight="700">1</text><text x="94" y="186" fill="#f4fdee" font-size="13.5" text-anchor="start" font-weight="600">Declare the resource</text><text x="56" y="212.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">file:src/a.go — the caller</text><text x="56" y="228.675" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">names it</text><path d="M246 206h26" stroke="#95b9a8" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#arrow-d)"/><path class="flow flow-a" d="M246 206h26" stroke="#56e656" stroke-width="1.8" fill="none"/><rect x="276" y="150" width="202" height="112" rx="12" fill="#0c1717" stroke="#173c1d" stroke-width="1.1"/><circle cx="306" cy="180" r="16" fill="#56e656" fill-opacity=".16" stroke="#56e656" stroke-opacity=".7"/><text x="306" y="185" fill="#56e656" font-size="14" text-anchor="middle" font-weight="700">2</text><text x="330" y="186" fill="#f4fdee" font-size="13.5" text-anchor="start" font-weight="600">Read the lease table</text><text x="292" y="212.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Free? Grant it and record</text><text x="292" y="228.675" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">the owner</text><path d="M482 206h26" stroke="#95b9a8" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#arrow-d)"/><path class="flow flow-b" d="M482 206h26" stroke="#56e656" stroke-width="1.8" fill="none"/><rect x="512" y="150" width="202" height="112" rx="12" fill="#0c1717" stroke="#173c1d" stroke-width="1.1"/><circle cx="542" cy="180" r="16" fill="#56e656" fill-opacity=".16" stroke="#56e656" stroke-opacity=".7"/><text x="542" y="185" fill="#56e656" font-size="14" text-anchor="middle" font-weight="700">3</text><text x="566" y="186" fill="#f4fdee" font-size="13.5" text-anchor="start" font-weight="600">Check the wait-for graph</text><text x="528" y="212.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Would waiter -&gt; holder</text><text x="528" y="228.675" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">close a cycle?</text><path d="M718 206h26" stroke="#95b9a8" stroke-opacity=".8" stroke-width="1.6" marker-end="url(#arrow-d)"/><path class="flow flow-c" d="M718 206h26" stroke="#56e656" stroke-width="1.8" fill="none"/><rect x="748" y="150" width="202" height="112" rx="12" fill="#0c1717" stroke="#173c1d" stroke-width="1.1"/><circle cx="778" cy="180" r="16" fill="#56e656" fill-opacity=".16" stroke="#56e656" stroke-opacity=".7"/><text x="778" y="185" fill="#56e656" font-size="14" text-anchor="middle" font-weight="700">4</text><text x="802" y="186" fill="#f4fdee" font-size="13.5" text-anchor="start" font-weight="600">Grant, queue or refuse</text><text x="764" y="212.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">b -&gt; a -&gt; b is refused and</text><text x="764" y="228.675" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">printed</text><text x="40" y="290" fill="#95b9a8" font-size="13" text-anchor="start" font-weight="600">Outcomes</text><rect x="40" y="302" width="150" height="34" rx="17.0" fill="#6ae7ac" fill-opacity=".14" stroke="#6ae7ac" stroke-opacity=".7" stroke-width="1.1"/><text x="115.0" y="324.0" fill="#6ae7ac" font-size="13" text-anchor="middle" font-weight="600">granted</text><rect x="204" y="302" width="150" height="34" rx="17.0" fill="#c7f6ac" fill-opacity=".14" stroke="#c7f6ac" stroke-opacity=".7" stroke-width="1.1"/><text x="279.0" y="324.0" fill="#c7f6ac" font-size="13" text-anchor="middle" font-weight="600">queued → granted</text><rect x="368" y="302" width="300" height="34" rx="17.0" fill="#f4fdee" fill-opacity=".14" stroke="#f4fdee" stroke-opacity=".7" stroke-width="1.1"/><text x="518.0" y="324.0" fill="#f4fdee" font-size="13" text-anchor="middle" font-weight="600">refused: b -&gt; a -&gt; b</text><line x1="40" y1="362" x2="960" y2="362" stroke="#173c1d" stroke-width="1"/><text x="40" y="390.0" fill="#f4fdee" font-size="13.5" text-anchor="start" font-weight="400">A refused acquire fails fast with the cycle named, so neither agent hangs.</text></svg>