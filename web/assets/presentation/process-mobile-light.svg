<svg xmlns="http://www.w3.org/2000/svg" width="460" height="620" viewBox="0 0 460 620" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="process-mobile-light-t process-mobile-light-d"><title id="process-mobile-light-t">What happens on one acquire</title><desc id="process-mobile-light-d">The same four checks stacked vertically with the three outcomes beneath them.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#318431"/><stop offset=".55" stop-color="#3b8060"/><stop offset="1" stop-color="#637a56"/></linearGradient><radialGradient id="halo"><stop stop-color="#318431" stop-opacity=".30"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#637a56" stop-opacity=".22"/><stop offset="1" stop-color="#f9fef9" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#cbf7cb" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#318431" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#557b6b" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="460" height="620" fill="#f9fef9"/><rect width="460" height="620" fill="url(#grid)" opacity=".5"/><circle cx="230.0" cy="310.0" r="391.0" fill="url(#halo)"/><text x="28" y="46" fill="#132a1c" font-size="17" text-anchor="start" font-weight="600">What happens on one acquire</text><circle cx="52" cy="108" r="17" fill="#318431" fill-opacity=".16" stroke="#318431" stroke-opacity=".7"/><text x="52" y="113" fill="#318431" font-size="15" text-anchor="middle" font-weight="700">1</text><text x="84" y="104" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">Declare the resource</text><text x="84" y="124.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">file:src/a.go — the caller names it</text><path d="M52 125v24" stroke="#318431" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="52" cy="190" r="17" fill="#318431" fill-opacity=".16" stroke="#318431" stroke-opacity=".7"/><text x="52" y="195" fill="#318431" font-size="15" text-anchor="middle" font-weight="700">2</text><text x="84" y="186" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">Read the lease table</text><text x="84" y="206.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Free? Grant it and record the owner</text><path d="M52 207v24" stroke="#318431" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="52" cy="272" r="17" fill="#318431" fill-opacity=".16" stroke="#318431" stroke-opacity=".7"/><text x="52" y="277" fill="#318431" font-size="15" text-anchor="middle" font-weight="700">3</text><text x="84" y="268" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">Check the wait-for graph</text><text x="84" y="288.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">Would waiter -&gt; holder close a cycle?</text><path d="M52 289v24" stroke="#318431" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="52" cy="354" r="17" fill="#318431" fill-opacity=".16" stroke="#318431" stroke-opacity=".7"/><text x="52" y="359" fill="#318431" font-size="15" text-anchor="middle" font-weight="700">4</text><text x="84" y="350" fill="#132a1c" font-size="14.5" text-anchor="start" font-weight="600">Grant, queue or refuse</text><text x="84" y="370.0" fill="#557b6b" font-size="11.5" text-anchor="start" font-weight="400">b -&gt; a -&gt; b is refused and printed</text><rect x="28" y="422" width="120" height="30" rx="15.0" fill="#3b8060" fill-opacity=".14" stroke="#3b8060" stroke-opacity=".7" stroke-width="1.1"/><text x="88.0" y="442.0" fill="#3b8060" font-size="13" text-anchor="middle" font-weight="600">granted</text><rect x="158" y="422" width="120" height="30" rx="15.0" fill="#637a56" fill-opacity=".14" stroke="#637a56" stroke-opacity=".7" stroke-width="1.1"/><text x="218.0" y="442.0" fill="#637a56" font-size="13" text-anchor="middle" font-weight="600">queued</text><rect x="28" y="462" width="250" height="30" rx="15.0" fill="#132a1c" fill-opacity=".14" stroke="#132a1c" stroke-opacity=".7" stroke-width="1.1"/><text x="153.0" y="482.0" fill="#132a1c" font-size="13" text-anchor="middle" font-weight="600">refused: b -&gt; a -&gt; b</text><text x="28" y="526.0" fill="#557b6b" font-size="12.5" text-anchor="start" font-weight="400">A refused acquire fails fast with the cycle named, so</text><text x="28" y="544.125" fill="#557b6b" font-size="12.5" text-anchor="start" font-weight="400">neither agent hangs.</text></svg>