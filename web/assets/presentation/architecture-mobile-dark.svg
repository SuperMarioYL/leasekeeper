<svg xmlns="http://www.w3.org/2000/svg" width="460" height="620" viewBox="0 0 460 620" data-palette="56e656-6ae7ac-c7f6ac-392c1aef88d4" role="img" aria-labelledby="architecture-mobile-dark-t architecture-mobile-dark-d"><title id="architecture-mobile-dark-t">Leasekeeper architecture</title><desc id="architecture-mobile-dark-d">The same six packages stacked as a vertical pipeline.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="430"><stop stop-color="#56e656"/><stop offset=".55" stop-color="#6ae7ac"/><stop offset="1" stop-color="#c7f6ac"/></linearGradient><radialGradient id="halo"><stop stop-color="#56e656" stop-opacity=".30"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><radialGradient id="halo2"><stop stop-color="#c7f6ac" stop-opacity=".22"/><stop offset="1" stop-color="#050c0d" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#173c1d" stroke-opacity=".5" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#56e656" stroke-width="1.6"/></marker><marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#95b9a8" stroke-width="1.4"/></marker></defs><style>
text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pulse{animation:pulse 3.6s ease-in-out infinite}
.pulse-b{animation:pulse 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulse-c{animation:pulse 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.flow{stroke-dasharray:9 131;animation:flow 5.5s linear infinite}
.flow-b{animation-delay:1.8s}
.flow-c{animation-delay:3.7s}
@keyframes flow{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.drift{animation:drift 9s ease-in-out infinite}
.drift-b{animation:drift 9s ease-in-out infinite;animation-delay:3s}
@keyframes drift{0%,100%{opacity:.18}50%{opacity:.55}}
.spin{transform-box:view-box;animation:spin 30s linear infinite}
.spin-r{transform-box:view-box;animation:spin 42s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.pulse-b,.pulse-c,.flow,.flow-b,.flow-c,.drift,.drift-b,.spin,.spin-r{animation:none}}
</style><rect width="460" height="620" fill="#050c0d"/><rect width="460" height="620" fill="url(#grid)" opacity=".5"/><circle cx="230.0" cy="310.0" r="391.0" fill="url(#halo)"/><text x="28" y="46" fill="#f4fdee" font-size="17" text-anchor="start" font-weight="600">One binary, three modes, one broker per run</text><text x="28" y="72.0" fill="#95b9a8" font-size="12.5" text-anchor="start" font-weight="400">Six packages, one process per run.</text><rect x="28" y="108" width="404" height="62" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="28" y="108" width="3" height="62" rx="1.5" fill="#56e656"/><text x="42" y="134" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">cmd/leasekeeper</text><text x="42" y="154.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Single entry point</text><path d="M230.0 170v18" stroke="#56e656" stroke-opacity=".6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="28" y="188" width="404" height="62" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="28" y="188" width="3" height="62" rx="1.5" fill="#56e656"/><text x="42" y="214" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">internal/cli</text><text x="42" y="234.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">run · acquire · release · status · demo</text><path d="M230.0 250v18" stroke="#56e656" stroke-opacity=".6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="28" y="268" width="404" height="62" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="28" y="268" width="3" height="62" rx="1.5" fill="#56e656"/><text x="42" y="294" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">internal/client</text><text x="42" y="314.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Unix-socket RPC</text><path d="M230.0 330v18" stroke="#56e656" stroke-opacity=".6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="28" y="348" width="404" height="62" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="28" y="348" width="3" height="62" rx="1.5" fill="#56e656"/><text x="42" y="374" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">internal/broker</text><text x="42" y="394.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Lease table + wait-for graph</text><path d="M230.0 410v18" stroke="#56e656" stroke-opacity=".6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="28" y="428" width="404" height="62" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="28" y="428" width="3" height="62" rx="1.5" fill="#56e656"/><text x="42" y="454" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">internal/lease</text><text x="42" y="474.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">file · port · gpu · quota</text><path d="M230.0 490v18" stroke="#56e656" stroke-opacity=".6" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="28" y="508" width="404" height="62" rx="10" fill="#0c1717" stroke="#56e656" stroke-opacity=".55" stroke-width="1.2"/><rect x="28" y="508" width="3" height="62" rx="1.5" fill="#56e656"/><text x="42" y="534" fill="#f4fdee" font-size="14.5" text-anchor="start" font-weight="600">internal/waitgraph</text><text x="42" y="554.0" fill="#95b9a8" font-size="11.5" text-anchor="start" font-weight="400">Refuses the circular wait</text></svg>